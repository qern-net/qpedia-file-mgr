name: Shared files
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
  files:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: shared_files_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      FILE_MANAGER_TEST_DATABASE_URL: postgres://postgres:fixture@localhost:5432/shared_files_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: file-manager/routes
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang cmake pkg-config
      - run: cargo test --locked --manifest-path file-manager/archive/Cargo.toml
      - run: cargo build --locked --manifest-path file-manager/archive/Cargo.toml
      - run: python3 file-manager/archive/tests/compatibility.py file-manager/archive/target/debug/qpedia-file-archive
      - run: cargo test --locked --manifest-path file-manager/routes/Cargo.toml --test files
